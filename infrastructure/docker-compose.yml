version: '3.8'

services:
  # 1. Broker MQTT (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./data/mosquitto_data:/mosquitto/data
      - ./data/mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # 2. Banco de Dados Time-Series (InfluxDB v2)
  influxdb:
    image: influxdb:2
    container_name: iot_influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=gestor
      - DOCKER_INFLUXDB_INIT_PASSWORD=senha_segura_123 # Altere em produção
      - DOCKER_INFLUXDB_INIT_ORG=unimater
      - DOCKER_INFLUXDB_INIT_BUCKET=energia_salas
    restart: unless-stopped

  # 3. Back-end Python (Orquestrador IoT + Interface Web)
  backend:
    build: ../backend
    container_name: iot_backend
    env_file:
      - ../backend/.env
    environment:
      # Dentro da rede Docker, os serviços são acessados pelo nome do contêiner.
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - INFLUX_URL=http://influxdb:8086
      - WEB_PORT=5000
    ports:
      - "5000:5000" # Interface web de configuração (RF05)
    volumes:
      - ./data/backend_data:/app/data # Persiste config.json (RF05/T07)
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  # 4. Dashboard (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin # Altere em produção
    depends_on:
      - influxdb
    restart: unless-stopped

